# Prometheus: thu thap metrics tu cac target
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus tu scrape chinh no
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. MySQL metrics (qua mysqld-exporter)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  # 3. Nginx metrics (qua nginx-prometheus-exporter doc stub_status)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # 4. Container metrics (CPU/RAM/IO cua tung container qua cAdvisor)
  - job_name: 'containers'
    static_configs:
      - targets: ['cadvisor:8080']
