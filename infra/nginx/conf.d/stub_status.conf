# Endpoint stub_status cho nginx-prometheus-exporter (chi noi bo, khong publish ra host)
server {
    listen 8080;
    server_name _;

    location /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # cho phep cac docker network noi bo
        deny all;
    }
}
