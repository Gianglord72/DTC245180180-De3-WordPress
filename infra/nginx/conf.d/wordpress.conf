# ============================================================
# Nginx Reverse Proxy + SSL termination cho WordPress (De 3)
# HTTP  (80)  -> redirect 301 sang HTTPS (443)
# HTTPS (443) -> proxy_pass toi wordpress:80 (Apache trong container)
# ============================================================

# --- HTTP: chuyen huong sang HTTPS ---
server {
    listen 80;
    server_name _;   # lab local dung IP, neu co domain thi thay bang ten mien
    return 301 https://$host:8443$request_uri;
}

# --- HTTPS: reverse proxy toi WordPress ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Chung chi tu ky (self-signed) tao bang OpenSSL
    ssl_certificate     /etc/nginx/ssl/wordpress.local.crt;
    ssl_certificate_key /etc/nginx/ssl/wordpress.local.key;

    # Cau hinh SSL an toan (Hardening)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gioi han kich thuoc upload (phu hop WordPress)
    client_max_body_size 64M;

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Thoi gian cho proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Bo nho dem static (tang toc)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # Cache static file truc tiep tai Nginx (giam tai WordPress)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }


    location /grafana/ {

        proxy_pass http://wordpress-demo-grafana:3000;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Proto $scheme;

    }

}
